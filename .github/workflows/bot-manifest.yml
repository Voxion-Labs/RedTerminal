name: Bot Manifest Ledger

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'bot-manifest.json'

permissions:
  contents: write

jobs:
  update-ledger:
    # Strictly isolate execution to the upstream repo, blocking external fork or PR privilege escalation
    if: github.repository == 'Voxion-Labs/RedTerminal'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Bot Manifest Ledger
        run: |
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" | sed 's/"/\\"/g')
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 -c "
          import json, os

          manifest_path = 'bot-manifest.json'
          with open(manifest_path, 'r') as f:
              data = json.load(f)

          data['ledger']['last_commit_sha'] = os.environ.get('COMMIT_SHA', '')
          data['ledger']['last_commit_message'] = os.environ.get('COMMIT_MSG', '')
          data['ledger']['last_commit_author'] = os.environ.get('COMMIT_AUTHOR', '')
          data['ledger']['last_updated_utc'] = os.environ.get('TIMESTAMP', '')
          data['ledger']['build_status'] = 'verified'

          with open(manifest_path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "
        env:
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Commit and Push Ledger Update
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot-manifest.json

          # Only commit if changes are present
          if ! git diff --staged --quiet; then
            git commit -m "chore(bot): update bot-manifest ledger [skip ci]"
            git push origin main
          fi
