<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedTerminal</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="boot-screen">
        <div id="boot-text"></div>
    </div>
    
    <main id="terminal-container">
        <header id="terminal-header">
            <div class="window-controls">
                <div class="btn close"></div>
                <div class="btn min"></div>
                <div class="btn max"></div>
            </div>
            <div class="window-title">root@redterm:~ (bash)</div>
        </header>
        
        <div id="terminal">
            <div id="output"></div>
            <div id="input-line">
                <span id="prompt">
                    <span class="prompt-host">redterm</span>
                    <span class="prompt-arrow">&gt;</span>
                </span>
                <span id="typed-input"></span><span class="cursor"></span>
                <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>
    </main>

    <!-- Minimal Status Bar -->
    <footer id="status-bar">
        <div class="status-left">
            <span class="status-brand">REDTERM v1.0</span>
        </div>
        <div class="status-center">
            <span>Uptime: <span id="status-uptime">00:00:00</span></span>
        </div>
        <div class="status-right">
            <span>WASM Memory: <span id="status-wasm-mem">16.4 MB</span></span>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
